<svg class="viz" id="g-gas-720" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="g-gas-720-t g-gas-720-d" style="max-width:720px;height:auto;display:block">
<title id="g-gas-720-t">Da dove entra il gas in Italia: quote degli ultimi 12 mesi</title><desc id="g-gas-720-d">Quota di ogni punto sugli ingressi da gasdotti e GNL, novembre 2025 – novembre 2026: Mazara del Vallo (Algeria) 34,0%; Melendugno, TAP (Azerbaigian) 16,5%; Adriatic LNG, Rovigo (GNL) 14,1%; Passo Gries (Nord Europa) 13,0%; Piombino (GNL) 6,9%; OLT Livorno (GNL) 6,7%; Ravenna (GNL) 3,5%; Tarvisio (Austria) 2,7%; Panigaglia (GNL) 1,5%; Gela, Greenstream (Libia) 0,8%; Gorizia (Slovenia) 0,2%. Fonte: ENTSOG, dati Snam, al 2026-11-08.</desc>
