k, Red Sea € 0.49 million</title></path><text class="ne-m" x="563.5" y="133">4.21</text><text class="ne-l" x="16" y="170" font-weight="600">Rotterdam → Genoa</text><text class="ne-m" x="16" y="184">intra-EU voyage, 1,000 t VLSFO</text><path class="ne-s2" d="M16.0,192H99.9V214H16.0Z"><title>Rotterdam → Genoa: fuel € 0.66 million</title></path><path class="ne-s1" d="M101.9,192H135.3V214H101.9Z"><title>Rotterdam → Genoa: EU ETS € 0.27 million</title></path><path class="ne-s3" d="M137.3,192.0H140.3Q144.3,192.0 144.3,196.0V210.0Q144.3,214.0 140.3,214.0H137.3Z"><title>Rotterdam → Genoa: FuelEU (max) € 0.06 million</title></path><text class="ne-m" x="149.3" y="207">1.00</text></svg>