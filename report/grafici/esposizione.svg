<svg class="viz" id="g-esposizione-720" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" width="100%" role="img" aria-labelledby="g-esposizione-720-t g-esposizione-720-d" style="max-width:720px;height:auto;display:block">
<title id="g-esposizione-720-t">Quanto greggio e GNL arriva dal Golfo Persico, per paese importatore</title><desc id="g-esposizione-720-d">Quota delle importazioni (in valore) che arriva dai paesi del Golfo Persico. Barra: dal minimo (Iraq, Kuwait, Qatar, Bahrein, Iran: nessuna uscita alternativa) al massimo (con Arabia Saudita ed Emirati, che possono aggirare in parte Hormuz). Giappone: greggio 10,3–93,0%, GNL 5,6–6,7%; Egitto: greggio 0,9–89,7%, GNL 0,0–0,0%; Corea del Sud: greggio 23,0–68,8%, GNL 15,3–15,8%; Taiwan: greggio 19,5–61,1%, GNL 21,6–24,0%; India: greggio 22,6–47,9%, GNL 47,3–60,8%; Polonia: greggio 0,0–47,3%, GNL n.d.; Cina: greggio 16,0–37,8%, GNL 28,0–28,7%; Italia: greggio 5,6–10,2%, GNL 32,6–32,6%; Brasile: greggio 0,0–26,9%, GNL 0,0–0,0%; Spagna: greggio 4,3–10,3%, GNL 2,0–2,0%; Paesi Bassi: greggio 8,1–9,4%, GNL 0,0–0,0%; Stati Uniti: greggio 3,5–8,8%, GNL n.d.; Francia: greggio 6,5–8,7%, GNL 0,0–0,0%; Germania: greggio 4,0–5,8%, GNL n.d.; Regno Unito: greggio 0,0–0,0%, GNL 2,2–2,2%; Nigeria: greggio 0,0–0,0%, GNL n.d.. Fonte: UN Comtrade tramite paesi.json, anno 2025 (Taiwan 2024).</desc>
