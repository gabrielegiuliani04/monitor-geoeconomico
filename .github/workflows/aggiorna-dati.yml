name: Aggiorna dati

on:
  schedule:
    - cron: "15 5 * * *"     # ogni giorno alle 05:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
      AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze (solo per le navi)
        run: pip install -r raccolta/navi/requirements.txt
      # ogni fonte è indipendente: se una cade, le altre continuano
      - name: Flussi, noli, GPR, sanzioni
        continue-on-error: true
        run: python3 raccolta/flussi/raccogli.py
      - name: Scorte (gas UE, petrolio USA, grano, oro)
        continue-on-error: true
        run: python3 raccolta/scorte/raccogli.py
      - name: Navi (AIS)
        continue-on-error: true
        run: python3 raccolta/navi/raccogli.py
      - name: Calendario
        continue-on-error: true
        run: python3 raccolta/calendario/raccogli.py
      - name: Energia (GNL e gas Italia)
        continue-on-error: true
        run: python3 raccolta/energia/raccogli.py
      - name: Analisti (feed YouTube)
        continue-on-error: true
        run: python3 raccolta/analisti/raccogli.py
      - name: Ucraina (lanci e abbattimenti)
        continue-on-error: true
        run: python3 raccolta/ucraina/raccogli.py
      - name: Stretti (controllo e parti automatiche, per ultimo)
        continue-on-error: true
        run: python3 raccolta/stretti/raccogli.py
      - name: Nascondi eventuali chiavi nei file pubblici
        run: python3 raccolta/comune/nascondi_chiavi.py
      - name: Salva se cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Dati: aggiornamento automatico del $(date -u +%F)"
          git pull --rebase origin main
          git push
